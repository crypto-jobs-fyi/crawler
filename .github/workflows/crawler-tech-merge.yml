name: Run Crawler Tech Merge Jobs

on:
  workflow_dispatch:

jobs:
  run-crawler:
    uses: ./.github/workflows/reusable-crawler-run.yml
    permissions:
      contents: write
      pull-requests: write
    with:
      script_names: 'merge_tech_jobs.py write_tech_jobs_age.py get_new_tech_jobs.py'
      output_json: 'tech_current.json'
      branch_name: 'auto/crawler-tech-merge-jobs-update'
      pr_title: 'Automated update from merge_tech_jobs.py'
