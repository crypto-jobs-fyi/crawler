name: Run Crawler Crypto

on:
  workflow_call:
  workflow_dispatch:

jobs:
  run-crawler:
    uses: ./.github/workflows/reusable-crawler-run.yml
    permissions:
      contents: write
      pull-requests: write
    with:
      script_names: 'crypto_crawler.py'
      output_json: 'crypto_current_jobs_mix.json'
      branch_name: 'auto/crawler-update'
      pr_title: 'Automated update from crawler.py'
