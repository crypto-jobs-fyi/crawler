name: Run Crawler Crypto Merge Jobs

on:
  workflow_dispatch:

jobs:
  run-crawler:
    uses: ./.github/workflows/reusable-crawler-run.yml
    permissions:
      contents: write
      pull-requests: write
    with:
      script_names: 'merge_crypto_jobs.py write_jobs_age.py get_new_jobs.py'
      output_json: 'crypto_current.json'
      branch_name: 'auto/crawler-merge-jobs-update'
      pr_title: 'Automated update from merge_crypto_jobs.py'
