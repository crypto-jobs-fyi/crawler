name: Run Crawler FinTech Mix

on:
  schedule:
    - cron: '0 8 * * 2,6'
  workflow_dispatch:

jobs:
  run-crawler:
    uses: ./.github/workflows/reusable-crawler-run.yml
    permissions:
      contents: write
      pull-requests: write
    with:
      script_names: 'crawler_fin.py write_fin_jobs_age.py get_new_fin_jobs.py'
      output_json: 'fin_current_jobs_mix.json'
      branch_name: 'auto/crawler-fin-update'
      pr_title: 'Automated update from crawler_fin.py'
