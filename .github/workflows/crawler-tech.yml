name: Run Crawler Tech

on:
  schedule:
    - cron: '0 8 * * 2,6'
  workflow_dispatch:

jobs:
  run-crawler:
    uses: ./.github/workflows/reusable-crawler-run.yml
    permissions:
      contents: write
      pull-requests: write
    with:
      script_names: 'crawler_tech.py write_tech_jobs_age.py get_new_tech_jobs.py'
      output_json: 'tech_current_jobs.json'
      branch_name: 'auto/crawler-tech-update'
      pr_title: 'Automated update from crawler_tech.py'
