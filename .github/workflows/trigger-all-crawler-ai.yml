name: Run All Crawler AI Workflows

on:
  schedule:
    - cron: '0 8 * * 2,6'
  workflow_dispatch:

jobs:
  crawler-ai:
    uses: ./.github/workflows/crawler-ai.yml
    permissions:
      contents: write
      pull-requests: write

  crawler-ai-ashby:
    uses: ./.github/workflows/crawler-ai-ashby.yml
    permissions:
      contents: write
      pull-requests: write

  crawler-ai-greenhouse:
    uses: ./.github/workflows/crawler-ai-greenhouse.yml
    permissions:
      contents: write
      pull-requests: write

  crawler-ai-lever:
    uses: ./.github/workflows/crawler-ai-lever.yml
    permissions:
      contents: write
      pull-requests: write
