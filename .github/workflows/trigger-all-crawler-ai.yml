name: Run All Crawler AI Workflows

on:
  schedule:
    - cron: '0 8 * * 2,6'
  workflow_dispatch:

jobs:
  crawler-ai:
    uses: ./.github/workflows/crawler-ai.yml
    permissions:
      contents: write
      pull-requests: write
    with:
      script_name: crawler_ai.py

  crawler-ai-ashby:
    uses: ./.github/workflows/crawler-ai.yml
    permissions:
      contents: write
      pull-requests: write
    with:
      script_name: crawler_ai_ashby.py

  crawler-ai-greenhouse:
    uses: ./.github/workflows/crawler-ai.yml
    permissions:
      contents: write
      pull-requests: write
    with:
      script_name: crawler_ai_greenhouse.py

  crawler-ai-lever:
    uses: ./.github/workflows/crawler-ai.yml
    permissions:
      contents: write
      pull-requests: write
    with:
      script_name: crawler_ai_lever.py
