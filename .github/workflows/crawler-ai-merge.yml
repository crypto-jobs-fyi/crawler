name: Run Crawler AI Merge Jobs

on:
  workflow_dispatch:

jobs:
  run-crawler:
    uses: ./.github/workflows/reusable-crawler-run.yml
    permissions:
      contents: write
      pull-requests: write
    with:
      script_names: 'merge_ai_jobs.py write_ai_jobs_age.py get_new_ai_jobs.py'
      output_json: 'ai_current.json'
      branch_name: 'auto/crawler-merge-ai-jobs-update'
      pr_title: 'Automated update from merge_ai_jobs.py'
