name: Run Crawler Crypto Lever

on:
  schedule:
    - cron: '0 8 * * 2,6'
  workflow_dispatch:

jobs:
  run-crawler:
    uses: ./.github/workflows/reusable-crawler-run.yml
    permissions:
      contents: write
      pull-requests: write
    with:
      script_names: 'crypto_crawler_lever.py'
      output_json: 'crypto_current_lever.json'
      branch_name: 'auto/crypto-crawler-lever-update'
      pr_title: 'Automated update from crypto_crawler_lever.py'
