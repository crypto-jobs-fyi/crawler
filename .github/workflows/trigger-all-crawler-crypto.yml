name: Run All Crawler Crypto Workflows

on:
  schedule:
    - cron: '0 8 * * 2,6'
  workflow_dispatch:

jobs:
  crawler-crypto:
    uses: ./.github/workflows/crawler-crypto.yml
    permissions:
      contents: write
      pull-requests: write

  crawler-crypto-ashby:
    uses: ./.github/workflows/crawler-crypto-ashby.yml
    permissions:
      contents: write
      pull-requests: write

  crawler-crypto-greenhouse:
    uses: ./.github/workflows/crawler-crypto-greenhouse.yml
    permissions:
      contents: write
      pull-requests: write

  crawler-crypto-lever:
    uses: ./.github/workflows/crawler-crypto-lever.yml
    permissions:
      contents: write
      pull-requests: write
