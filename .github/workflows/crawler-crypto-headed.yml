name: Run Headed Crypto Playwright Crawler

on:
  schedule:
    - cron: '30 8 * * 2,6'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: crawler-crypto-headed
  cancel-in-progress: false

jobs:
  run-crawler:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium

      - name: Run headed crypto crawler
        env:
          PYTHONPATH: .
        run: |
          xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" \
            python crypto_crawler_headed.py

      - name: Validate generated JSON files
        run: |
          python - <<'PY'
          import json

          for filename in (
              "headed_crypto_jobs.json",
              "headed_crypto_current_jobs.json",
          ):
              with open(filename, encoding="utf-8") as file:
                  json.load(file)
              print(f"Validated {filename}")
          PY

      - name: Publish JSON files
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'chore: update headed crypto jobs [automated]'
          add-paths: |
            headed_crypto_jobs.json
            headed_crypto_current_jobs.json
          base: main
          branch: auto/crawler-crypto-headed-update
          title: 'Automated update from crypto_crawler_headed.py'
          body: |
            This PR contains the JSON output generated by
            `crypto_crawler_headed.py` using the Playwright headed crawler.

            Updated files:
            - `headed_crypto_jobs.json`
            - `headed_crypto_current_jobs.json`
          delete-branch: true
