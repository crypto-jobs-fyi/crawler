name: Run Headed Crypto Playwright Crawler

on:
  workflow_call:
  schedule:
    - cron: '30 6 * * 2,6'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: crawler-crypto-headed
  cancel-in-progress: false

jobs:
  run-crawler:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium

      - name: Get before total_jobs
        id: before
        run: |
          for filename in headed_crypto_jobs.json headed_crypto_current_jobs.json; do
            if [ -f "$filename" ]; then
              total=$(jq -r '(.total_jobs // .["Total Jobs"] // 0)' "$filename")
            else
              total=0
            fi
            if [ "$filename" = "headed_crypto_jobs.json" ]; then
              echo "jobs=$total" >> "$GITHUB_OUTPUT"
            else
              echo "current_jobs=$total" >> "$GITHUB_OUTPUT"
            fi
          done

      - name: Run headed crypto crawler
        env:
          PYTHONPATH: .
        run: |
          xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" \
            python crypto_crawler_headed.py

      - name: Validate generated JSON files
        run: |
          python - <<'PY'
          import json

          for filename in (
              "headed_crypto_jobs.json",
              "headed_crypto_current_jobs.json",
          ):
              with open(filename, encoding="utf-8") as file:
                  json.load(file)
              print(f"Validated {filename}")
          PY

      - name: Get after total_jobs
        id: after
        run: |
          echo "jobs=$(jq -r '(.total_jobs // .["Total Jobs"] // 0)' headed_crypto_jobs.json)" >> "$GITHUB_OUTPUT"
          echo "current_jobs=$(jq -r '(.total_jobs // .["Total Jobs"] // 0)' headed_crypto_current_jobs.json)" >> "$GITHUB_OUTPUT"

      - name: Publish JSON files
        id: create-pr
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'chore: update headed crypto jobs [automated]'
          add-paths: |
            headed_crypto_jobs.json
            headed_crypto_current_jobs.json
          base: main
          branch: auto/crawler-crypto-headed-update
          title: 'Automated update from crypto_crawler_headed.py'
          body: |
            This PR contains changes made by running `crypto_crawler_headed.py` via GitHub Actions.

            `headed_crypto_jobs.json` total_jobs: ${{ steps.before.outputs.jobs }} -> ${{ steps.after.outputs.jobs }}
            `headed_crypto_current_jobs.json` total_jobs: ${{ steps.before.outputs.current_jobs }} -> ${{ steps.after.outputs.current_jobs }}
          delete-branch: true

      - name: Add full jobs data as PR comment
        if: steps.create-pr.outputs.pull-request-operation != 'none'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo '### Full Jobs Data'
            echo '#### headed_crypto_jobs.json'
            echo '```json'
            jq . headed_crypto_jobs.json
            echo '```'
            echo '#### headed_crypto_current_jobs.json'
            echo '```json'
            jq . headed_crypto_current_jobs.json
            echo '```'
          } > /tmp/comment_body.md
          gh pr comment "${{ steps.create-pr.outputs.pull-request-number }}" --body-file /tmp/comment_body.md
