name: Run Crawler AI

on:
  schedule:
    - cron: '0 8 * * 2,6'
  workflow_dispatch:

jobs:
  run-crawler:
    uses: ./.github/workflows/reusable-crawler-run.yml
    permissions:
      contents: write
      pull-requests: write
    with:
      script_names: 'crawler_ai.py'
      output_json: 'ai_current_jobs_mix.json'
      branch_name: 'auto/crawler-ai-update'
      pr_title: 'Automated update from crawler_ai.py'
