name: Run Crawler Crypto Greenhouse

on:
  workflow_call:
  workflow_dispatch:

jobs:
  run-crawler:
    uses: ./.github/workflows/reusable-crawler-run.yml
    permissions:
      contents: write
      pull-requests: write
    with:
      script_names: 'crypto_crawler_greenhouse.py'
      output_json: 'crypto_current_gh.json'
      branch_name: 'auto/crypto-crawler-greenhouse-update'
      pr_title: 'Automated update from crypto_crawler_greenhouse.py'
