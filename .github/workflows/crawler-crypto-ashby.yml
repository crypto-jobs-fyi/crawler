name: Run Crawler Crypto Ashby

on:
  workflow_call:
  workflow_dispatch:

jobs:
  run-crawler:
    uses: ./.github/workflows/reusable-crawler-run.yml
    permissions:
      contents: write
      pull-requests: write
    with:
      script_names: 'crypto_crawler_ashby.py'
      output_json: 'crypto_current_ashby.json'
      branch_name: 'auto/crypto-crawler-ashby-update'
      pr_title: 'Automated update from crypto_crawler_ashby.py'
