name: Run Crawler AI Lever

on:
  workflow_call:
  workflow_dispatch:

jobs:
  run-crawler:
    uses: ./.github/workflows/reusable-crawler-run.yml
    permissions:
      contents: write
      pull-requests: write
    with:
      script_names: 'crawler_ai_lever.py'
      output_json: 'ai_current_jobs_lever.json'
      branch_name: 'auto/crawler-ai-lever-update'
      pr_title: 'Automated update from crawler_ai_lever.py'
